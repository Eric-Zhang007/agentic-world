<!doctype html><html lang="zh"><meta charset="utf-8"><title>GTA 相机轨迹与参考帧对</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f6f7f8;color:#202d32}header{padding:14px 20px;background:white;border-bottom:1px solid #ccc}h1{font-size:22px;margin:0 0 12px}select,input,button{padding:7px;margin:3px;border:1px solid #aaa;background:white;max-width:100%}main{display:grid;grid-template-columns:48% 52%;padding:12px;gap:10px}canvas{width:100%;height:650px;background:white;touch-action:none}#pair{width:100%;height:auto}#info{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}footer{padding:12px 20px;line-height:1.7} @media(max-width:850px){main{grid-template-columns:1fr}canvas{height:430px}}</style>
<header><h1>最终交付 · 相机轨迹与参考帧对</h1><select id="episode"></select><select id="kind"><option value="">全部关系</option><option>same_camera_return</option><option>cross_camera_passage</option><option>nearby_history</option></select><input id="search" placeholder="搜索 sample ID"><select id="sample" style="width:620px"></select><button id="prev">←</button><button id="next">→</button><button id="local">局部</button><button id="full">全轨迹</button></header>
<main><section><canvas id="map"></canvas><div id="info"></div></section><section><img id="pair"><p><a id="original">原始帧与状态（精选样本）</a></p></section></main>
<footer>绿点 R：过去的参考相机；橙点 T：目标视频起点；箭头：相机朝向的水平分量。紫色虚线仅表示参考关系，不是运动轨迹。灰线为同一录制与时钟域的已记录轨迹，蓝线强调参考到目标时间内的相关相机轨迹。滚轮缩放，拖动画布平移，点击点位切换样本。<br>坐标使用原始世界 X/Y，横纵同尺度；图上另列高度差和完整三维视角差。轨迹为约 5 秒采样，间隔超过 7.5 秒或时钟变化时断开。点位接近不一定看见同一背景，请结合右侧 RGB／白模检查。上排为历史参考，下排为目标起始帧。</footer>
<script>const D=__DATA__;const $=id=>document.getElementById(id), c=$('map'),ctx=c.getContext('2d');let list=[],s,view,drag;
const episodes=[...new Set(D.samples.map(x=>x.episode))].sort();for(const x of episodes)$('episode').add(new Option(x,x));
function filter(){list=D.samples.filter(x=>x.episode==$('episode').value&&(!$('kind').value||x.kind==$('kind').value)&&x.id.includes($('search').value));$('sample').replaceChildren();for(const x of list)$('sample').add(new Option(`${x.kind} | ${x.age.toFixed(1)}s | ${x.id}`,x.id));select()}
function select(){s=list.find(x=>x.id==$('sample').value);if(!s){ctx.clearRect(0,0,c.width,c.height);$('pair').removeAttribute('src');$('info').textContent='没有对应样本';return}$('pair').src=s.image;$('info').textContent=`${s.id}\n${s.kind} | ${s.split}\n时间差 ${s.age.toFixed(2)} 秒；XY 距离 ${s.xy.toFixed(2)}；3D 距离 ${s.distance.toFixed(2)}；高度差 ${s.dz.toFixed(2)}；视角差 ${s.angle.toFixed(2)}°\nR ${s.ref.agent} t=${s.ref.t.toFixed(3)} XYZ=${s.ref.xyz.map(v=>v.toFixed(2)).join(', ')}\nT ${s.target.agent} t=${s.target.t.toFixed(3)} XYZ=${s.target.xyz.map(v=>v.toFixed(2)).join(', ')}`;$('original').style.display=D.selected.includes(s.id)?'block':'none';$('original').href='examples/'+s.id+'/reference_rgb.png';fit(false)}
function tracks(){return D.tracks.filter(t=>t.episode==s.episode&&t.clock==s.ref.clock)}
function fit(full){if(!s)return;let p=full?tracks().flatMap(t=>t.points.map(p=>p.xyz)):[s.ref.xyz,s.target.xyz];let xs=p.map(x=>x[0]),ys=p.map(x=>x[1]);view={x:(Math.min(...xs)+Math.max(...xs))/2,y:(Math.min(...ys)+Math.max(...ys))/2,r:Math.max(25,(Math.max(...xs)-Math.min(...xs))/2,(Math.max(...ys)-Math.min(...ys))/2)*1.15};draw()}
function draw(){if(!s||!view)return;const w=c.clientWidth,h=c.clientHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,w,h);const k=Math.min(w,h)/(2*view.r);window.xy=p=>[w/2+(p[0]-view.x)*k,h/2-(p[1]-view.y)*k];ctx.font='12px sans-serif';const step=10**Math.floor(Math.log10(view.r/3));ctx.strokeStyle='#e6e9eb';ctx.lineWidth=1;for(let v=Math.floor((view.x-view.r*2)/step)*step;v<view.x+view.r*2;v+=step){let [x]=xy([v,view.y]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();ctx.fillStyle='#68767b';ctx.fillText(v.toFixed(0),x+2,h-5)}for(let v=Math.floor((view.y-view.r*2)/step)*step;v<view.y+view.r*2;v+=step){let [,y]=xy([view.x,v]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();ctx.fillText(v.toFixed(0),3,y-2)}
for(const tr of tracks()){ctx.strokeStyle='#bac3c7';ctx.lineWidth=1;ctx.beginPath();tr.points.forEach((p,i)=>{let [x,y]=xy(p.xyz);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();let ps=tr.points.filter(p=>p.t>=s.ref.t&&p.t<=s.target.t&&[s.ref.agent,s.target.agent].includes(p.agent));ctx.strokeStyle='#496f9d';ctx.lineWidth=2;ctx.beginPath();ps.forEach((p,i)=>{let [x,y]=xy(p.xyz);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
for(const p of list){let [x,y]=xy(p.target.xyz);ctx.fillStyle='#b8a2b3';ctx.fillRect(x-2,y-2,4,4)}let a=xy(s.ref.xyz),b=xy(s.target.xyz);ctx.setLineDash([5,4]);ctx.strokeStyle='#a2448c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([]);
for(const [p,col,label] of [[s.ref,'#16876c','R'],[s.target,'#d85832','T']]){let [x,y]=xy(p.xyz),dx=p.forward[0]*35,dy=-p.forward[1]*35;ctx.fillStyle=col;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();let angle=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-8*Math.cos(angle-.5),y+dy-8*Math.sin(angle-.5));ctx.lineTo(x+dx-8*Math.cos(angle+.5),y+dy-8*Math.sin(angle+.5));ctx.fill();ctx.fillText(label,x+8,y-8)}ctx.fillStyle='#24333c';ctx.fillText('World XY · +Y ↑ · +X →',10,20)}
for(const id of ['episode','kind'])$(id).onchange=filter;$('search').oninput=filter;$('sample').onchange=select;$('local').onclick=()=>fit(false);$('full').onclick=()=>fit(true);for(const [id,n] of [['prev',-1],['next',1]])$(id).onclick=()=>{if(!list.length)return;$('sample').selectedIndex=($('sample').selectedIndex+n+list.length)%list.length;select()};c.onwheel=e=>{e.preventDefault();view.r*=Math.exp(e.deltaY*.001);draw()};c.onpointerdown=e=>{drag={x:e.offsetX,y:e.offsetY,v:{...view},m:false};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let k=Math.min(c.clientWidth,c.clientHeight)/(2*drag.v.r);if(Math.abs(e.offsetX-drag.x)+Math.abs(e.offsetY-drag.y)>4)drag.m=true;view.x=drag.v.x-(e.offsetX-drag.x)/k;view.y=drag.v.y+(e.offsetY-drag.y)/k;draw()};c.onpointerup=e=>{if(drag&&!drag.m){let near=list.map(p=>({p,d:Math.min(...[p.ref,p.target].map(q=>{let [x,y]=xy(q.xyz);return Math.hypot(x-e.offsetX,y-e.offsetY)}))})).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<18){$('sample').value=near.p.id;select()}}drag=null};window.onresize=draw;filter();</script></html>
